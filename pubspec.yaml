name: mediahub
description: "Personal multimedia library and player for Android."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # Firebase packages
  firebase_core:
  firebase_auth: ^7.1.0
  cloud_firestore:

  # Audio player packages
  just_audio:

  # Video player packages
  video_player:

  # YouTube player packages
  youtube_player_flutter:
  
  # Media manager
  photo_manager: ^3.12.0

  # utilities
  url_launcher: 
  font_awesome_flutter: 


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/music/
    - assets/video/
    - assets/images/
    - assets/images/logo/

